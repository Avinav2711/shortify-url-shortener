version: "1"

services:
  # The Node.js Backend API
  - type: web
    name: url-shortener-api
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PG_USER
        fromDatabase:
          name: url-shortener-db
          property: user
      - key: PG_HOST
        fromDatabase:
          name: url-shortener-db
          property: host
      - key: PG_DATABASE
        fromDatabase:
          name: url-shortener-db
          property: database
      - key: PG_PASSWORD
        fromDatabase:
          name: url-shortener-db
          property: password
      - key: PG_PORT
        fromDatabase:
          name: url-shortener-db
          property: port
      - key: REDIS_URL
        sync: false # We will add this manually in the dashboard

databases:
  # The PostgreSQL Database
  - name: url-shortener-db
    databaseName: url_shortener